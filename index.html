<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перекрёстки — куб</title>
<style>
  :root {
    --bg: #0d1016;
    --bg-2: #151a23;
    --panel: rgba(18, 22, 30, 0.92);
    --line: rgba(255, 255, 255, 0.09);
    --text: #e7eaf0;
    --muted: #9aa3b2;
    --warn: #f5b74f;
    --accent: #8fb3ff;
    --panel-w: 340px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { background: radial-gradient(1200px 800px at 65% 40%, #1a2130 0%, var(--bg) 70%); }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #panel { position: fixed; left: 12px; top: 12px; bottom: 12px; width: var(--panel-w); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 12px;
    backdrop-filter: blur(6px); }
  h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: .2px; }
  .sub { color: var(--muted); margin-bottom: 14px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  .toggles { display: grid; gap: 6px; }
  .toggles label.tog { color: var(--text); }
  .seg { display: flex; gap: 6px; margin-bottom: 8px; }
  .seg button, .chip { appearance: none; border: 1px solid var(--line); background: var(--bg-2); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .seg button { flex: 1; }
  .seg button.on { border-color: var(--accent); color: #fff; background: #1d2740; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row-ctl { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 4px; }
  label.tog { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .chip { padding: 5px 0; font-weight: 700; text-align: center; }
  .chip.on { outline: 2px solid #fff; outline-offset: 1px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  .face-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .face-card .t { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .face-card .side { display: grid; grid-template-columns: 62px 1fr; gap: 2px 8px; padding: 3px 0; border-top: 1px solid var(--line); }
  .face-card .side:first-of-type { border-top: 0; }
  .face-card .k { color: var(--muted); }
  .face-card .ps { grid-column: 2; color: var(--muted); font-size: 11.5px; }
  .hint { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 4px; border-top: 1px solid var(--line); white-space: nowrap; }
  tr.edge { cursor: default; }
  tr.edge:hover td, tr.edge.on td { background: rgba(143, 179, 255, 0.08); }
  td.n { text-align: right; color: var(--muted); }
  td.arrow { color: var(--muted); text-align: center; }
  .warn { color: var(--warn); }
  ul.notes { margin: 0; padding-left: 16px; }
  ul.notes li { margin-bottom: 7px; }
  code { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfd6e4; }
  #tip { position: fixed; pointer-events: none; background: rgba(10, 12, 18, 0.95); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 9px; font-size: 12px; display: none; max-width: 300px; z-index: 5; }
  #tip b { font-weight: 700; }
  #tip .m { color: var(--muted); }
  #loading { position: fixed; right: 16px; bottom: 14px; color: var(--muted); font-size: 12px; }
  @media (max-width: 760px) {
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 44vh; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<aside id="panel">
  <h1>Перекрёстки</h1>
  <div class="sub" id="sub"></div>

  <div class="seg">
    <button id="bScene">Как в сцене</button>
    <button id="bCube">Куб</button>
  </div>
  <input id="k" type="range" min="0" max="1000" value="0" aria-label="Сцена ⟷ куб">
  <div class="row-ctl">
    <span>сцена</span>
    <label class="tog"><input id="rot" type="checkbox"> вращать</label>
    <span>куб</span>
  </div>

  <h2>На кубе</h2>
  <div class="toggles">
    <label class="tog"><input type="checkbox" id="tLabels"> буквы граней</label>
    <label class="tog"><input type="checkbox" id="tSides"> стороны: цветные полосы и подписи</label>
    <label class="tog"><input type="checkbox" id="tMarkers"> номера проходов</label>
  </div>
  <div class="hint" style="margin-top:6px">Линии связей приглушены — наведите на линию, грань или строку таблицы, чтобы подсветить.</div>

  <h2>Грани</h2>
  <div class="chips" id="chips"></div>
  <div id="faceInfo"><div class="face-card hint">Наведите на грань или выберите букву. Клик по грани закрепляет выбор.</div></div>

  <h2 id="edgesTitle">Рёбра куба</h2>
  <table id="edges"></table>

  <h2>Замечания</h2>
  <ul class="notes" id="notes"></ul>
</aside>

const SIDE_NAME = { N: 'NORTH', E: 'EAST', S: 'SOUTH', W: 'WEST' };
const SIDE_LOCAL = { N: [0, 1, 0], E: [1, 0, 0], S: [0, -1, 0], W: [-1, 0, 0] };
const TEX = 1024, BAND = 64, INSET = 60, MR = 26;   // INSET: portal point sits in the corridor mouth at the face edge

document.getElementById('loading').remove();

// ---------- lookups ----------
const sideInfo = {};            // sideInfo[F][side] = {to, toSide, count, misaligned, edgeIndex}
DATA.edges.forEach((e, i) => {
  (sideInfo[e.a] ??= {})[e.as_] = { to: e.b, toSide: e.bs, count: e.count, misaligned: e.misaligned, edgeIndex: i };
  (sideInfo[e.b] ??= {})[e.bs] = { to: e.a, toSide: e.as_, count: e.count, misaligned: e.misaligned, edgeIndex: i };
});
const portalsBy = {};          // portalsBy[F][side] = [portal...] sorted by num
for (const p of DATA.portals) ((portalsBy[p.face] ??= {})[p.side] ??= []).push(p);
for (const f of FACES) for (const s of SIDES) portalsBy[f]?.[s]?.sort((a, b) => a.num - b.num);
const opposite = {};
for (const f of FACES) opposite[f] = FACES.find(g => g !== f && !SIDES.some(s => sideInfo[f][s].to === g));

function markerPx(p) {          // marker centre in texture pixels (x right, y down)
  const t = p.t * TEX, c = TEX / 2;
  return { N: [c + t, INSET], S: [c + t, TEX - INSET], E: [TEX - INSET, c + t], W: [INSET, c + t] }[p.side];
}
const pxToLocal = ([x, y]) => new THREE.Vector3(x / TEX - 0.5, 0.5 - y / TEX, 0);

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotateSpeed = 1.2;

// ---------- face textures ----------
function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
const show = { labels: false, sides: false, markers: false };
const faceTex = {};             // faceTex[F] = {img, cv, tex}
function paintFace(f) {
  const { img, cv, tex } = faceTex[f];
  const g = cv.getContext('2d');
  g.drawImage(img, 0, 0, TEX, TEX);
  if (show.sides) for (const s of SIDES) {
    const info = sideInfo[f][s];
    g.save();
    g.translate(TEX / 2, TEX / 2);
    g.rotate({ N: 0, E: Math.PI / 2, S: Math.PI, W: -Math.PI / 2 }[s]);
    g.translate(-TEX / 2, -TEX / 2);
    g.globalAlpha = 0.92;
    g.fillStyle = COLORS[info.to];
    g.beginPath(); g.moveTo(0, 0); g.lineTo(TEX, 0); g.lineTo(TEX - BAND, BAND); g.lineTo(BAND, BAND); g.closePath(); g.fill();
    g.globalAlpha = 1;
    g.fillStyle = '#0b0d12';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const n = info.count > 1 ? `  ×${info.count}` : '';
    const label = `${SIDE_NAME[s]} → ${info.to} ${SIDE_NAME[info.toSide]}${n}`;
    // put the label in the widest stretch of the band that no portal point covers
    const sign = s === 'N' || s === 'E' ? 1 : -1;
    const busy = portalsBy[f][s].map(p => TEX / 2 + sign * p.t * TEX).sort((x, y) => x - y);
    const stops = [BAND * 0.8, ...busy.flatMap(u => [u - MR - 8, u + MR + 8]), TEX - BAND * 0.8];
    let gap = [stops[0], stops[1]];
    for (let i = 0; i < stops.length; i += 2) if (stops[i + 1] - stops[i] > gap[1] - gap[0]) gap = [stops[i], stops[i + 1]];
    const base = Math.round(BAND * 0.6);
    g.font = `800 ${base}px system-ui, sans-serif`;
    const fit = Math.max(16, Math.min(base, Math.floor(base * (gap[1] - gap[0] - 16) / g.measureText(label).width)));
    g.font = `800 ${fit}px system-ui, sans-serif`;
    g.fillText(label, (gap[0] + gap[1]) / 2, BAND / 2 + 1);
    g.restore();
  }
  if (show.markers) for (const s of SIDES) for (const p of portalsBy[f][s]) {
    const [x, y] = markerPx(p);
    g.beginPath(); g.arc(x, y, MR, 0, Math.PI * 2);
    g.fillStyle = COLORS[p.to.face]; g.fill();
    g.lineWidth = 5; g.strokeStyle = '#0b0d12'; g.stroke();
    g.fillStyle = '#0b0d12'; g.font = `800 ${MR * 1.25}px system-ui, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(p.num), x, y + 2);
  }
  tex.needsUpdate = true;
}
function labelSprite(f) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.beginPath(); g.arc(64, 64, 54, 0, Math.PI * 2);
  g.fillStyle = COLORS[f]; g.fill(); g.lineWidth = 7; g.strokeStyle = '#0b0d12'; g.stroke();
  g.fillStyle = '#0b0d12'; g.font = '800 70px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(f, 64, 69);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sp.scale.set(0.17, 0.17, 1);
  return sp;
}

// ---------- layouts ----------
const v3 = a => new THREE.Vector3(...a);
const quatFromBasis = (x, y, z) => new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
const rects = FACES.map(f => DATA.faces[f].scene);
const minX = Math.min(...rects.map(r => r[0])), maxX = Math.max(...rects.map(r => r[0] + r[2]));
const minY = Math.min(...rects.map(r => r[1])), maxY = Math.max(...rects.map(r => r[1] + r[3]));
const UNIT = rects[0][2];
const flatQ = quatFromBasis(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 1, 0));

const faceObj = {};
const faceMeshes = [];
for (const f of FACES) {
  const d = DATA.faces[f];
  const [x, y, w, h] = d.scene;
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, color: 0xffffff });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  mesh.userData.face = f;
  group.add(mesh);
  const label = labelSprite(f);
  label.position.set(0, 0, 0.12);
  label.visible = show.labels;
  group.add(label);
  scene.add(group);
  faceMeshes.push(mesh);
  faceObj[f] = {
    group, mesh, mat, label,
    flatPos: new THREE.Vector3((x + w / 2 - (minX + maxX) / 2) / UNIT, 0, (y + h / 2 - (minY + maxY) / 2) / UNIT),
    flatQ,
    cubePos: v3(d.n).multiplyScalar(0.5),
    cubeQ: quatFromBasis(v3(d.uE), v3(d.uN), v3(d.n)),
    n: v3(d.n),
  };
}
Promise.all(FACES.map(f => loadImage(DATA.faces[f].img))).then(imgs => {
  imgs.forEach((img, i) => {
    const f = FACES[i];
    const cv = document.createElement('canvas'); cv.width = cv.height = TEX;
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    faceTex[f] = { img, cv, tex };
    paintFace(f);
    faceObj[f].mat.map = tex; faceObj[f].mat.needsUpdate = true;
  });
});

const cubeEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
scene.add(cubeEdges);

// ---------- arcs (one per two-way portal pair) ----------
const SEG = 48;
const ARC_DIM = { opacity: 0.28, width: 1.8 }, ARC_HOT = { opacity: 1, width: 3.6 };
const arcs = DATA.pairs.map(p => {
  const geom = new LineGeometry();
  const mat = new LineMaterial({ linewidth: ARC_DIM.width, vertexColors: true, transparent: true, opacity: ARC_DIM.opacity, depthWrite: false });
  const line = new Line2(geom, mat);
  line.renderOrder = 2;
  scene.add(line);
  const ca = new THREE.Color(COLORS[p.b.face]), cb = new THREE.Color(COLORS[p.a.face]);
  const cols = [];
  for (let i = 0; i <= SEG; i++) { const c = ca.clone().lerp(cb, i / SEG); cols.push(c.r, c.g, c.b); }
  const arc = { p, geom, mat, line, cols, colorsSet: false, edge: sideInfo[p.a.face][p.a.side].edgeIndex };
  line.userData.arc = arc;
  return arc;
});
const arcLines = arcs.map(a => a.line);
const portalOf = (f, s, n) => portalsBy[f][s].find(p => p.num === n);
function endpoint(ref) {
  const o = faceObj[ref.face];
  const local = pxToLocal(markerPx(portalOf(ref.face, ref.side, ref.num)));
  local.z = 0.004;
  return {
    pos: o.group.localToWorld(local),
    n: new THREE.Vector3(0, 0, 1).applyQuaternion(o.group.quaternion),
    d: v3(SIDE_LOCAL[ref.side]).applyQuaternion(o.group.quaternion),
  };
}
const _b = new THREE.Vector3();
function updateArcs() {
  scene.updateMatrixWorld(true);
  for (const a of arcs) {
    const A = endpoint(a.p.a), B = endpoint(a.p.b);
    const dist = A.pos.distanceTo(B.pos);
    const h = 0.12 + 0.42 * dist;   // 0.12 keeps the bridge apex outside the cube edge when folded
    const c1 = A.pos.clone().addScaledVector(A.n, 0.72 * h).addScaledVector(A.d, 0.28 * h);
    const c2 = B.pos.clone().addScaledVector(B.n, 0.72 * h).addScaledVector(B.d, 0.28 * h);
    const pts = [];
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG, u = 1 - t;
      _b.set(0, 0, 0)
        .addScaledVector(A.pos, u * u * u).addScaledVector(c1, 3 * u * u * t)
        .addScaledVector(c2, 3 * u * t * t).addScaledVector(B.pos, t * t * t);
      pts.push(_b.x, _b.y, _b.z);
    }
    a.geom.setPositions(pts);
    if (!a.colorsSet) { a.geom.setColors(a.cols); a.colorsSet = true; }
  }
}

// ---------- morph between scene layout and cube ----------
let k = 1;
const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function applyK() {
  const e = ease(k);
  const lift = Math.sin(Math.PI * e) * 0.55;
  for (const f of FACES) {
    const o = faceObj[f];
    o.group.position.lerpVectors(o.flatPos, o.cubePos, e).addScaledVector(o.n, lift);
    o.group.quaternion.slerpQuaternions(o.flatQ, o.cubeQ, e);
  }
  cubeEdges.material.opacity = Math.max(0, (e - 0.85) / 0.15) * 0.35;
  updateArcs();
  slider.value = Math.round(k * 1000);
  bScene.classList.toggle('on', k === 0);
  bCube.classList.toggle('on', k === 1);
}

// ---------- camera presets & tweening ----------
const VIEW = {
  scene: { pos: new THREE.Vector3(0, 5.0, 3.0), target: new THREE.Vector3(0, 0, 0.3) },
  cube: { pos: new THREE.Vector3(2.35, 1.75, 2.75), target: new THREE.Vector3(0, 0, 0) },
};
camera.position.copy(VIEW.cube.pos); controls.target.copy(VIEW.cube.target);
let tween = null;
function goTo(targetK, ms = 2400) {
  const view = targetK === 1 ? VIEW.cube : VIEW.scene;
  tween = { t0: performance.now(), ms, k0: k, k1: targetK,
    p0: camera.position.clone(), p1: view.pos.clone(), q0: controls.target.clone(), q1: view.target.clone() };
}
function stepTween(now) {
  if (!tween) return;
  const t = Math.min(1, (now - tween.t0) / tween.ms);
  const s = ease(t);
  k = tween.k0 + (tween.k1 - tween.k0) * t;
  camera.position.lerpVectors(tween.p0, tween.p1, s);
  controls.target.lerpVectors(tween.q0, tween.q1, s);
  applyK();
  if (t === 1) tween = null;
}

// ---------- UI ----------
const slider = document.getElementById('k');
const bScene = document.getElementById('bScene');
const bCube = document.getElementById('bCube');
const rot = document.getElementById('rot');
slider.addEventListener('input', () => { tween = null; k = slider.value / 1000; applyK(); });
bScene.addEventListener('click', () => goTo(0));
bCube.addEventListener('click', () => goTo(1));
rot.addEventListener('change', () => { controls.autoRotate = rot.checked; });
const bindToggle = (id, key, apply) => {
  const el = document.getElementById(id);
  el.checked = show[key];
  el.addEventListener('change', () => { show[key] = el.checked; apply(); });
};
const repaintAll = () => FACES.forEach(f => faceTex[f] && paintFace(f));
bindToggle('tLabels', 'labels', () => FACES.forEach(f => { faceObj[f].label.visible = show.labels; }));
bindToggle('tSides', 'sides', repaintAll);
bindToggle('tMarkers', 'markers', repaintAll);

const pairCount = DATA.pairs.length;
const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
};
document.getElementById('sub').textContent =
  `${FACES.length} ${plural(FACES.length, 'грань', 'грани', 'граней')} · ${DATA.edges.length} ${plural(DATA.edges.length, 'ребро', 'ребра', 'рёбер')} · ` +
  `${pairCount} ${plural(pairCount, 'двусторонний проход', 'двусторонних прохода', 'двусторонних проходов')} ` +
  `(${pairCount * 2} ${plural(pairCount * 2, 'телепорт', 'телепорта', 'телепортов')})`;

const chips = document.getElementById('chips');
for (const f of FACES) {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = f; b.style.background = COLORS[f]; b.style.color = '#0b0d12';
  b.addEventListener('click', () => { locked = locked === f ? null : f; refresh(); });
  b.addEventListener('mouseenter', () => { hoverFace = f; refresh(); });
  b.addEventListener('mouseleave', () => { hoverFace = null; refresh(); });
  b.dataset.face = f;
  chips.appendChild(b);
}
const sw = f => `<span class="sw" style="background:${COLORS[f]}"></span>`;
document.getElementById('edgesTitle').textContent = `Рёбра куба (${DATA.edges.length})`;
const edgesTable = document.getElementById('edges');
edgesTable.innerHTML = DATA.edges.map((e, i) => `
  <tr class="edge" data-i="${i}">
    <td>${sw(e.a)}<b>${e.a}</b> ${SIDE_NAME[e.as_]}</td>
    <td class="arrow">↔</td>
    <td>${sw(e.b)}<b>${e.b}</b> ${SIDE_NAME[e.bs]}</td>
    <td class="n">×${e.count}${e.misaligned ? ' <span class="warn" title="Проёмы на ребре не совпадают">⚠</span>' : ''}</td>
  </tr>`).join('');
edgesTable.querySelectorAll('tr.edge').forEach(tr => {
  tr.addEventListener('mouseenter', () => { hoverEdge = +tr.dataset.i; refresh(); });
  tr.addEventListener('mouseleave', () => { hoverEdge = null; refresh(); });
});

const misaligned = DATA.edges.filter(e => e.misaligned);
const notes = [];
notes.push('Положение на кубе: <b>A</b> сверху, <b>E</b> снизу, <b>C</b> спереди, <b>D</b> справа, <b>B</b> слева, <b>F</b> сзади — и F перевёрнута: её NORTH смотрит вниз, к E.');
notes.push(`Противоположные грани (без общего ребра): ${['A', 'B', 'C'].map(f => `<b>${f}</b>–<b>${opposite[f]}</b>`).join(', ')}.`);
notes.push(`Все ${pairCount * 2} ${plural(pairCount * 2, 'телепорт', 'телепорта', 'телепортов')} парные: у каждого «X → Y» есть обратный «Y → X», цель совпадает с именем региона, ни один не выключен. Склейка даёт ровно 8 вершин по 3 грани — это корректный куб.`);
notes.push(`Каждый проход привязан к проёму коридора на краю карты своей грани (число проёмов на каждой стороне совпадает с числом проходов). ` +
  `${DATA.alignedPairs} из ${pairCount} пар проёмов сходятся на общем ребре куба — расхождение не больше ${Math.round(DATA.alignedMaxGap * 100)}% длины ребра.`);
const pct = a => a.map(v => `${v}%`).join(' и ');
for (const e of misaligned) {
  const nums = e.count > 1 ? `проходы ${Array.from({ length: e.count }, (_, i) => i + 1).join(', ')}` : 'проход';
  notes.push(`<span class="warn">⚠ ${e.a} ${SIDE_NAME[e.as_]} ↔ ${e.b} ${SIDE_NAME[e.bs]}: проёмы не совпадают на ребре.</span> ` +
    `На ${e.a} ${nums} — на ${pct(e.fromTop.a)} высоты ребра от A, на ${e.b} — на ${pct(e.fromTop.b)}. ${e.count > 1 ? 'Мостики идут' : 'Мостик идёт'} наискосок.`);
}
if (misaligned.length) {
  notes.push('Причина у обоих рёбер одна: F на кубе перевёрнута (её NORTH смотрит к E), и её верх/низ стыкуются с A и E точно, ' +
    'а проёмы на её западной и восточной сторонах стоят так, будто F не перевёрнута. Перенумерация проходов это не исправит — сдвинуть пришлось бы сами проёмы на карте F (или на B и D).');
}
if (DATA.extras.length) {
  notes.push('Не учтены (не стороны куба): ' + DATA.extras.map(x => `<code>${x.name}</code> → <code>${x.to.join(', ')}</code>`).join('; ') + '.');
}
notes.push('Полосы сторон, номера проходов и буквы граней включаются в «На кубе». Полоса — цвет грани, куда ведёт эта сторона; кружок с цифрой — проход (номер из имени региона) в своём проёме. Порядок проходов по проёмам взят из положения их регионов в сцене. Коридоры-оверлеи вне карт граней не показаны.');
document.getElementById('notes').innerHTML = notes.map(n => `<li>${n}</li>`).join('');

// ---------- highlight ----------
let hoverFace = null, locked = null, hoverEdge = null, hoverArc = null;
const faceInfo = document.getElementById('faceInfo');
function renderFaceInfo(f) {
  if (!f) { faceInfo.innerHTML = '<div class="face-card hint">Наведите на грань или выберите букву. Клик по грани закрепляет выбор.</div>'; return; }
  const rows = SIDES.map(s => {
    const i = sideInfo[f][s];
    const ps = portalsBy[f][s].map(p => `${p.num}→${p.to.face}${p.to.side}${p.to.num}`).join(', ');
    return `<div class="side"><span class="k">${SIDE_NAME[s]}</span><span>${sw(i.to)}<b>${i.to}</b> ${SIDE_NAME[i.toSide]} · ×${i.count}${i.misaligned ? ' <span class="warn">⚠</span>' : ''}</span>` +
      `<span class="ps">${ps}</span></div>`;
  }).join('');
  faceInfo.innerHTML = `<div class="face-card"><div class="t">${sw(f)}Грань ${f}${locked === f ? ' · закреплена' : ''}</div>${rows}` +
    `<div class="side"><span class="k">напротив</span><span>${sw(opposite[f])}<b>${opposite[f]}</b> — общего ребра нет</span></div>` +
    `<div class="ps" style="margin-top:6px;color:var(--muted)">${DATA.faces[f].file}</div></div>`;
}
function refresh() {
  const f = hoverFace ?? locked;
  let faceLevel = () => 1, arcOn = () => true;
  if (hoverEdge != null) {
    const e = DATA.edges[hoverEdge];
    faceLevel = g => (g === e.a || g === e.b ? 1 : 0.28);
    arcOn = a => a.edge === hoverEdge;
  } else if (f) {
    const nbs = SIDES.map(s => sideInfo[f][s].to);
    faceLevel = g => (g === f ? 1 : nbs.includes(g) ? 0.82 : 0.22);
    arcOn = a => a.p.a.face === f || a.p.b.face === f;
  }
  for (const g of FACES) faceObj[g].mat.color.setScalar(faceLevel(g));
  if (hoverArc) arcOn = a => a === hoverArc;
  else if (hoverEdge == null && !f) arcOn = () => false;
  for (const a of arcs) {
    const st = arcOn(a) ? ARC_HOT : ARC_DIM;
    a.mat.opacity = st.opacity; a.mat.linewidth = st.width;
    a.line.renderOrder = st === ARC_HOT ? 3 : 2;
  }
  chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.face === locked));
  edgesTable.querySelectorAll('tr.edge').forEach(tr => tr.classList.toggle('on', +tr.dataset.i === hoverEdge));
  renderFaceInfo(f);
}

// ---------- picking ----------
const raycaster = new THREE.Raycaster();
raycaster.params.Line2 = { threshold: 7 };
const ndc = new THREE.Vector2();
const tip = document.getElementById('tip');
let downAt = null;
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(faceMeshes, false)[0];
  const arcHit = raycaster.intersectObjects(arcLines, false)[0];
  if (arcHit && (!hit || arcHit.distance <= hit.distance)) return { f: null, portal: null, arc: arcHit.object.userData.arc };
  if (!hit) return null;
  const f = hit.object.userData.face;
  const px = [hit.uv.x * TEX, (1 - hit.uv.y) * TEX];
  let portal = null;
  if (show.markers) for (const s of SIDES) for (const p of portalsBy[f][s]) {
    const [x, y] = markerPx(p);
    if (Math.hypot(px[0] - x, px[1] - y) <= MR * 1.25) portal = p;
  }
  return { f, portal, arc: null };
}
canvas.addEventListener('pointermove', ev => {
  const h = pick(ev);
  const nf = h ? h.f : null, na = h ? h.arc : null;
  if (nf !== hoverFace || na !== hoverArc) { hoverFace = nf; hoverArc = na; refresh(); }
  canvas.style.cursor = na ? 'pointer' : '';
  if (!h) { tip.style.display = 'none'; return; }
  if (h.arc) {
    const p = h.arc.p;
    const pa = portalOf(p.a.face, p.a.side, p.a.num), pb = portalOf(p.b.face, p.b.side, p.b.num);
    tip.innerHTML = `<b>${p.a.face} ${SIDE_NAME[p.a.side]} ${p.a.num}</b> ↔ <b>${p.b.face} ${SIDE_NAME[p.b.side]} ${p.b.num}</b>` +
      (p.misaligned ? ' <span class="warn">⚠ проёмы не совпадают на ребре</span>' : '') +
      `<div class="m">«${pa.region}»<br>«${pb.region}»</div>`;
  } else if (h.portal) {
    const p = h.portal;
    const back = portalOf(p.to.face, p.to.side, p.to.num);
    tip.innerHTML = `<b>${p.face} ${SIDE_NAME[p.side]} ${p.num}</b> → <b>${p.to.face} ${SIDE_NAME[p.to.side]} ${p.to.num}</b>` +
      `<div class="m">выход: «${p.region}»<br>вход: «${back.arrival}»</div>`;
  } else {
    const i = sideInfo[h.f];
    tip.innerHTML = `<b>Грань ${h.f}</b> <span class="m">${DATA.faces[h.f].file}</span><div class="m">` +
      SIDES.map(s => `${SIDE_NAME[s]} → ${i[s].to}`).join(' · ') + '</div>';
  }
  tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(ev.clientY + 14, window.innerHeight - tip.offsetHeight - 8) + 'px';
});
canvas.addEventListener('pointerleave', () => {
  tip.style.display = 'none';
  if (hoverFace || hoverArc) { hoverFace = null; hoverArc = null; refresh(); }
});
canvas.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
canvas.addEventListener('pointerup', ev => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
  const h = pick(ev);
  if (h && h.arc) return;
  locked = h ? (locked === h.f ? null : h.f) : null;
  refresh();
});

// ---------- resize (keep the scene centred in the area right of the panel) ----------
const panel = document.getElementById('panel');
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  const side = w > 760 ? panel.offsetWidth + 12 : 0;
  camera.aspect = (w + side) / h;
  camera.setViewOffset(w + side, h, 0, 0, w, h);
  camera.updateProjectionMatrix();
  for (const a of arcs) a.mat.resolution.set(w, h);
}
window.addEventListener('resize', resize);
resize();

// ---------- go ----------
applyK();
refresh();
renderer.setAnimationLoop(now => {
  stepTween(now);
  controls.update();
  renderer.render(scene, camera);
});
window.__cube = { get k() { return k; }, goTo, faceObj, arcs, camera, controls };
</script>
